name: Release macOS App

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_with_signing:
    runs-on: macos-15
    env:
      PROJECT_NAME: battakorey
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID signing certificate
        env:
          DEV_ID_APP_CERTIFICATE_BASE64: ${{ secrets.DEV_ID_APP_CERTIFICATE_BASE64 }}
          DEV_ID_APP_CERTIFICATE_PASSWORD: ${{ secrets.DEV_ID_APP_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail

          for variable in \
            DEV_ID_APP_CERTIFICATE_BASE64 \
            DEV_ID_APP_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            TEAM_ID
          do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable repository secret is not configured."
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$DEV_ID_APP_CERTIFICATE_BASE64" |
            base64 --decode -o "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"

          security import "$certificate_path" \
            -P "$DEV_ID_APP_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -v team_id="$TEAM_ID" '
                /Developer ID Application:/ && index($0, "(" team_id ")") {
                  print $2
                  exit
                }
              '
          )"

          if [[ -z "$signing_identity" ]]; then
            echo "::error::No Developer ID Application identity matches TEAM_ID."
            exit 1
          fi

          {
            echo "CODE_SIGN_IDENTITY=$signing_identity"
            echo "DEVELOPMENT_TEAM=$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: ./scripts/generate-project.sh

      - name: Build app
        run: |
          set -euo pipefail

          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          cp "${{ env.PROJECT_NAME }}/ExportOptions.plist" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy \
            -c "Add :teamID string $DEVELOPMENT_TEAM" \
            "$EXPORT_OPTIONS_PATH"

          xcodebuild \
            archive \
            -project "${{ env.PROJECT_NAME }}.xcodeproj/" \
            -scheme "${{ env.PROJECT_NAME }}" \
            -destination "generic/platform=macOS" \
            -archivePath "dist/${{ env.PROJECT_NAME }}.xcarchive" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          xcodebuild \
            -exportArchive \
            -archivePath "dist/${{ env.PROJECT_NAME }}.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath dist/

      - name: Create dmg
        run: |
          CAPITALIZED_PROJECT_NAME=$(echo ${{ env.PROJECT_NAME }} | awk '{print toupper(substr($0,1,1)) substr($0,2)}')

          brew install graphicsmagick imagemagick
          npm install --global create-dmg
          create-dmg 'dist/${{ env.PROJECT_NAME }}.app' dist
          mv "$(find ./dist -type file -name '*.dmg')" "./dist/${CAPITALIZED_PROJECT_NAME}-Universal.dmg"

      - name: Notarize app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in APPLE_ID NOTARY_PASSWORD TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable repository secret is not configured."
              exit 1
            fi
          done

          CAPITALIZED_PROJECT_NAME=$(echo ${{ env.PROJECT_NAME }} | awk '{print toupper(substr($0,1,1)) substr($0,2)}')

          xcrun notarytool submit \
            --team-id "$TEAM_ID" \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait "./dist/${CAPITALIZED_PROJECT_NAME}-Universal.dmg"
          xcrun stapler staple "./dist/${CAPITALIZED_PROJECT_NAME}-Universal.dmg"
          xcrun stapler validate "./dist/${CAPITALIZED_PROJECT_NAME}-Universal.dmg"

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
          generate_release_notes: true

      - name: Delete temporary signing files
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
